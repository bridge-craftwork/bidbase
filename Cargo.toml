[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "crates/wasm", "crates/forms", "crates/vbui", "crates/practice", "crates/practice-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bridge-craftwork/bidbase"

[workspace.dependencies]
bridge-types = { git = "https://github.com/bridge-craftwork/bridge-types" }
bridge-card = { git = "https://github.com/bridge-craftwork/convention-card", tag = "v0.9.0" }
bidbase-engine = { path = "crates/engine" }
bridge-encodings = { git = "https://github.com/bridge-craftwork/bridge-encodings" }
csv = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
