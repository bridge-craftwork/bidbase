# Map from a convention card (convention-card's native JSON, the fields in
# its spec/fields.toml) to BidBase's convention switches (`BidNames`:
# `Selected` / `SubCat_Selected`). With a card, each listed convention is
# switched on or off by the card; the rest keep the database's setting.
#
# Keys are `BidNames.IDnum`; `name` is the `Bid_Name`, for reading only.
#
#   on = "path"                  on when the bool field is true
#   on = "!path"                 on when the bool field is false
#   on = { "path" = value, ... } on when every field has that value
#   on = [ cond, cond, ... ]     on when any of them holds
#   always = true                a BidBase category every system has
#                                ("Overcall: Resp. 2N Over P"): always on
#
# Unset card fields read as their spec default (bools: false). A path or
# value the card spec doesn't have is an error when the map loads.
#
# Unlisted on purpose (they keep the database's setting): conventions the
# card has no field for (Rosenkranz double, Brozel, ASTRO, CRASH, Truscott
# over 2C, 2C 19-HCP openings, Roman 2D, Two-Way Stayman, random splinters,
# "Free Bid, Negative", the variants of overcall cue-bid raises), and
# those used only to describe the opponents' methods (`AgainstID`).
#
# Sources: BidBase names and rule counts from data/2018 (BidNames.csv,
# Bids.csv); card fields from convention-card v0.9.0 spec/fields.toml.

