# bidbase-practice-web: the practice program in the browser. A cdylib
# that starts bidbase-practice on a canvas; built by web/build.sh
# (wasm-pack) into web/dist/practice/.
[package]
name = "bidbase-practice-web"
description = "Browser (WASM) build of the BidBase practice program port"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bidbase-practice = { path = "../practice" }
eframe = { version = "0.36", default-features = false, features = ["glow", "persistence", "accesskit", "x11", "wayland"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"
