# bidbase-wasm: the BidBase port in the browser. A JSON-in / JSON-out
# boundary over bidbase-engine, with Nelson's 2026 rules (data/2026)
# compiled in; another rule set can be passed as CSV text.
#
# Build: crates/wasm/build.sh (wasm-pack build --target web; output in
# crates/wasm/pkg). The API is in `api.rs`, plain Rust tested natively;
# `lib.rs` only binds it. Same layout as rusty-bidding-bot's rbb-wasm.
[package]
name = "bidbase-wasm"
description = "Browser (WASM) build of the BidBase port: JSON API over the engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bidbase-engine.workspace = true
bridge-card.workspace = true
bridge-types.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
# Readable panics in the browser console.
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]
